<svg viewBox="0 0 520 {{ alto }}" style="width:100%;height:{{ alto }}px" role="img" aria-label="Subgrafo de habilidades cubiertas y faltantes">
  {% for item in items %}
  <line x1="112" y1="{{ cy }}" x2="196" y2="{{ item.y }}" stroke="{% if item.ok %}#0DBA4E{% else %}#D6455B{% endif %}" stroke-width="{% if item.ok %}2{% else %}1.4{% endif %}"{% if not item.ok %} stroke-dasharray="4 3"{% endif %}/>
  <line x1="330" y1="{{ item.y }}" x2="410" y2="{{ cy }}" stroke="#67C2EC" stroke-width="1.6"/>
  <rect x="196" y="{{ item.y_rect }}" width="134" height="26" rx="8" fill="{% if item.ok %}var(--green-soft){% else %}var(--danger-soft){% endif %}" stroke="{% if item.ok %}#0DBA4E{% else %}#D6455B{% endif %}" stroke-width="1.4"/>
  <text x="263" y="{{ item.y_texto }}" text-anchor="middle" font-size="11" font-weight="600" fill="{% if item.ok %}#0A6B32{% else %}#D6455B{% endif %}">{{ item.rotulo }}</text>
  {% endfor %}
  <circle cx="70" cy="{{ cy }}" r="34" fill="#1F5172"/>
  <text x="70" y="{{ cy_arriba }}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">{{ sujeto }}</text>
  <text x="70" y="{{ cy_abajo }}" text-anchor="middle" font-size="8" fill="#B9D5E5">:Candidato</text>
  <rect x="410" y="{{ y_vacante }}" width="96" height="48" rx="10" fill="var(--sky-soft)" stroke="#67C2EC" stroke-width="1.6"/>
  <text x="458" y="{{ y_sigla }}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--navy)">{{ sigla }}</text>
  <text x="458" y="{{ cy_abajo }}" text-anchor="middle" font-size="8.5" fill="var(--navy-2)">:Vacante</text>
  <text x="150" y="16" font-size="8.5" fill="#0A6B32">:TIENE</text>
  <text x="345" y="16" font-size="8.5" fill="var(--navy-2)">:REQUIERE</text>
</svg>
