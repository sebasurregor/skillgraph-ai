{# Alerta única de validación. `visible` indica si el formulario llegó con errores. #}
<div id="alerta-form" class="alert alert-error{% if not visible %} hidden{% endif %}" role="alert">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
  <span>Favor ingresar información válida en los campos obligatorios</span>
</div>
